<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Грузоперевозки — дашборд</title>

<!-- iOS: превращает сайт в подобие приложения при "Добавить на экран Домой" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Грузоперевозки">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
  :root {
    --bg: #0b1120; --card: #161f36; --card2: #1f2a47; --text: #eef2f8; --muted: #93a1bd;
    --accent: #22c55e; --accent2: #06b6d4; --danger: #f43f5e; --warn: #f59e0b; --border: #263252;
    --grad: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; color:var(--text);
    background: radial-gradient(1200px 800px at 15% -10%, #16233f 0%, var(--bg) 55%) fixed,
                radial-gradient(900px 700px at 100% 0%, #123331 0%, transparent 50%) fixed, var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column;
    padding-bottom: env(safe-area-inset-bottom); }
  @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-14px,10px) scale(1.06); } }
  @keyframes fadeSlideIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes popIn { from { opacity:0; transform: scale(.92); } to { opacity:1; transform: scale(1); } }
  @keyframes pulseGlow { 0%,100% { box-shadow: 0 4px 18px rgba(34,197,94,.35); } 50% { box-shadow: 0 4px 28px rgba(6,182,212,.5); } }

  /* ---- логин ---- */
  #login { position:relative; flex:1; display:flex; flex-direction:column; justify-content:center;
    padding: 24px; gap: 14px; overflow:hidden; }
  #login::before, #login::after { content:""; position:absolute; width:220px; height:220px; border-radius:50%;
    filter:blur(60px); opacity:.35; z-index:0; animation: floatBlob 9s ease-in-out infinite; }
  #login::before { background:#22c55e; top:-60px; left:-60px; }
  #login::after { background:#06b6d4; bottom:-60px; right:-60px; animation-delay: -4s; }
  #login > * { position:relative; z-index:1; }
  #login .logo-badge { width:64px; height:64px; margin:0 auto 4px; border-radius:20px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 8px 24px rgba(34,197,94,.35);
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1); }
  #login h1 { font-size: 21px; text-align:center; margin: 4px 0 10px; font-weight:800; letter-spacing:-.01em; }
  #login input { background:var(--card); border:1px solid var(--border); color:var(--text);
    padding: 15px 16px; border-radius: 14px; font-size: 16px; width:100%;
    transition: border-color .18s, box-shadow .18s, transform .1s; }
  #login input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(34,197,94,.15); }
  #login button { background:var(--grad); color:#04220f; border:none; padding:15px;
    border-radius:14px; font-size:16px; font-weight:700; letter-spacing:.01em;
    transition: transform .12s ease, box-shadow .2s; box-shadow:0 6px 20px rgba(34,197,94,.3); }
  #login button:active { transform: scale(.97); }
  #loginError { color:var(--danger); font-size:14px; text-align:center; min-height:18px; }
  #apiUrlWrap { display:none; }
  #apiUrlWrap.show { display:block; }
  #apiUrlWrap small { color:var(--muted); }

  /* ---- каркас ---- */
  header.top { padding: 14px 16px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;
    background: rgba(11,17,32,.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  header.top .who { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  header.top .who b { color:var(--text); font-weight:600; }
  header.top button { background:var(--card2); border:1px solid var(--border); color:var(--muted); font-size:12px;
    padding:7px 12px; border-radius:999px; transition: color .15s, border-color .15s; }
  header.top button:active { transform: scale(.96); }
  main { flex:1; overflow-y:auto; padding: 14px 12px 90px; animation: fadeSlideIn .28s ease; }

  nav.tabs { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    display:flex; background: rgba(22,31,54,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top:1px solid var(--border); border-radius: 20px 20px 0 0; overflow:hidden;
    padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
  nav.tabs button { flex:1; background:none; border:none; color:var(--muted); padding:11px 4px 9px;
    font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px;
    transition: color .2s, transform .15s; }
  nav.tabs button span.ic { font-size:18px; transition: transform .2s ease; }
  nav.tabs button.active { color: var(--accent); }
  nav.tabs button.active span.ic { transform: translateY(-2px) scale(1.12); }
  nav.tabs button:active { transform: scale(.94); }

  .card { background: linear-gradient(160deg, var(--card) 0%, var(--card2) 130%); border:1px solid var(--border);
    border-radius:16px; padding:14px 16px; margin-bottom:10px; animation: popIn .3s ease; }
  .kpi-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:12px; }
  .kpi { background: linear-gradient(160deg, var(--card) 0%, var(--card2) 130%); border:1px solid var(--border);
    border-radius:16px; padding:14px; animation: popIn .32s ease; position:relative; overflow:hidden; }
  .kpi::after { content:""; position:absolute; top:-30px; right:-30px; width:70px; height:70px; border-radius:50%;
    background: var(--grad); opacity:.14; }
  .kpi .label { font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.01em; }
  .kpi .value { font-size:21px; font-weight:800; margin-top:5px; letter-spacing:-.01em; }
  .kpi .value.pos { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .kpi .value.neg { color: var(--danger); }

  .alarm { display:flex; justify-content:space-between; align-items:center; padding:11px 2px;
    border-bottom:1px solid var(--border); font-size:14px; }
  .alarm:last-child { border-bottom:none; }
  .alarm .n { background: linear-gradient(135deg, var(--danger), #fb923c); color:#fff; border-radius:999px;
    min-width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px;
    font-weight:700; padding:0 6px; box-shadow: 0 2px 8px rgba(244,63,94,.4); }
  .empty { color:var(--muted); text-align:center; padding:30px 8px; font-size:14px; }

  h2.section { font-size:12px; color:var(--muted); margin: 6px 4px 10px; text-transform:uppercase;
    letter-spacing:.08em; font-weight:700; }

  .row-item { background: linear-gradient(160deg, var(--card) 0%, var(--card2) 140%); border:1px solid var(--border);
    border-radius:14px; padding:13px 14px; margin-bottom:9px; animation: popIn .28s ease; transition: border-color .2s; }
  .row-item .rt { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .row-item .rt span:first-child { color:var(--text); }
  .row-item .rm { font-size:15px; }
  .row-item .fields { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px; }
  .row-item .fields label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
  .row-item .fields input, .row-item .fields select { width:100%; background:var(--card2); border:1px solid var(--border);
    color:var(--text); padding:9px; border-radius:9px; font-size:14px; transition: border-color .15s, box-shadow .15s; }
  .row-item .fields input:focus, .row-item .fields select:focus { outline:none; border-color:var(--accent2);
    box-shadow:0 0 0 3px rgba(6,182,212,.15); }
  .row-item .save { margin-top:10px; width:100%; background:var(--grad); color:#04220f; border:none;
    padding:11px; border-radius:10px; font-weight:700; font-size:13px; transition: transform .12s, background .25s; }
  .row-item .save:active { transform: scale(.97); }
  .row-item .save.pending { background: var(--warn); }
  .row-item .save.saved { background: var(--card2); color: var(--accent); }

  .fab { position:fixed; bottom:86px; right:calc(50% - 240px + 16px); background:var(--grad);
    color:#04220f; border:none; width:54px; height:54px; border-radius:50%; font-size:26px; font-weight:700;
    box-shadow:0 6px 20px rgba(34,197,94,.4); z-index:6; animation: pulseGlow 2.6s ease-in-out infinite;
    transition: transform .15s; }
  .fab:active { transform: scale(.9) rotate(90deg); }
  @media (max-width: 512px) { .fab { right:16px; } }

  .modal-bg { position:fixed; inset:0; background:rgba(4,8,18,.6); backdrop-filter: blur(2px); display:flex;
    align-items:flex-end; z-index:20; opacity:0; pointer-events:none; transition: opacity .22s; }
  .modal-bg.show { opacity:1; pointer-events:auto; }
  .modal { background: linear-gradient(170deg, var(--card) 0%, var(--card2) 150%); border:1px solid var(--border);
    width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0;
    padding:20px 18px calc(18px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  .modal-bg.show .modal { transform: translateY(0); }
  .modal h3 { margin-top:0; font-weight:800; }
  .modal label { font-size:12px; color:var(--muted); display:block; margin:10px 0 4px; font-weight:600; }
  .modal input, .modal select { width:100%; background:var(--card2); border:1px solid var(--border);
    color:var(--text); padding:12px; border-radius:10px; font-size:15px; transition: border-color .15s, box-shadow .15s; }
  .modal input:focus, .modal select:focus { outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px rgba(6,182,212,.15); }
  .modal .btns { display:flex; gap:10px; margin-top:18px; }
  .modal .btns button { flex:1; padding:13px; border-radius:12px; border:none; font-weight:700; transition: transform .12s; }
  .modal .btns button:active { transform: scale(.96); }
  .modal .btns .cancel { background:var(--card2); color:var(--text); border:1px solid var(--border); }
  .modal .btns .submit { background:var(--grad); color:#04220f; box-shadow:0 4px 14px rgba(34,197,94,.3); }

  .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-8px) scale(.94);
    background: linear-gradient(135deg, #0f2e1c, #0c2a30); color:var(--accent); border:1px solid var(--accent);
    padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600; z-index:30; opacity:0;
    transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1); pointer-events:none;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  .toast.err { background: linear-gradient(135deg, #2e0f0f, #2a0c1c); color:var(--danger); border-color:var(--danger); }

  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center-load { text-align:center; padding:40px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">

  <!-- ═══════ ЭКРАН ВХОДА ═══════ -->
  <div id="login">
    <div class="logo-badge">🚛</div>
    <h1>Грузоперевозки</h1>
    <input id="loginUser" type="text" placeholder="Логин" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="doLogin()">Войти</button>
    <div id="loginError"></div>
    <div id="apiUrlWrap">
      <small>Адрес API (URL Apps Script Web App):</small>
      <input id="apiUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
  </div>

  <!-- ═══════ ОСНОВНОЕ ПРИЛОЖЕНИЕ (скрыто до входа) ═══════ -->
  <div id="mainApp" style="display:none; flex-direction:column; flex:1;">
    <header class="top">
      <div class="who">👤 <b id="whoName"></b> · <span id="whoRole"></span></div>
      <button onclick="logout()">Выйти ↩</button>
    </header>

    <main id="main"></main>

    <button class="fab" id="fab" style="display:none" onclick="openAddModal()">+</button>

    <nav class="tabs" id="tabs"></nav>
  </div>

</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════ НАСТРОЙКА ═══════════════════════
   Впишите сюда URL вашего Apps Script Web App после публикации
   (Расширения → Apps Script → Развернуть → Новое развёртывание → Веб-приложение → скопировать /exec ссылку).
   Пока не вписан — при первом входе появится поле для ручного ввода, он сохранится в этом браузере. */
let API_URL = "https://script.google.com/macros/s/AKfycbwtbSOXBGiBzrlb0sFSQ5mrMNYQ8hnMb_wCOanUQa1-c7UIWteaK_vZRzgHsyVvf0du/exec";
/* ═══════════════════════════════════════════════════════════ */

let TOKEN = null, ROLE = null, NAME = null;
let СПРАВОЧНИКИ = null;
let currentTab = null;

const TABS = {
  'Владелец':  [['dashboard','Сводка','📊'], ['Маршруты','Плечи','🧭'], ['Рейсы','Рейсы','🚚'], ['Выдано','Выдано','💵'], ['Расходы','Расходы','🧾']],
  'Диспетчер': [['dashboard','Сводка','📊'], ['Маршруты','Плечи','🧭']],
  'Бухгалтер': [['dashboard','Сводка','📊'], ['Рейсы','Рейсы','🚚'], ['Заправки','Заправки','⛽'], ['Выдано','Выдано','💵'], ['Расходы','Расходы','🧾']]
};

const FIELD_META = {
  'Маршруты': { title: (р)=>р[0]||'—', sub: (р)=>р[1]||'', add: true,
    fields: [
      {i:0, label:'№ рейса', type:'select-trip'},
      {i:1, label:'Плечо (откуда — куда)', type:'text'},
      {i:2, label:'Груз / комментарий', type:'text'},
      {i:3, label:'Ставка', type:'number'},
      {i:4, label:'Валюта', type:'select', options:['KZT','RUB','USD','EUR','CNY']}
    ] },
  'Рейсы': { title:(р)=>р[0]||'—', sub:(р)=>(р[1]||'')+' · '+(р[2]||''), add:false,
    fields: [
      {i:24, label:'Остаток в баке по приезду, л (GPS)', type:'number'},
      {i:25, label:'Моточасы рефа: счётчик по приезду', type:'number'}
    ] },
  'Выдано': { title:(р)=>р[0]||'—', sub:(р)=>(р[2]||'')+' · '+(р[1]||''), add:false,
    fields: [
      {i:4, label:'Выдано KZT', type:'number'},
      {i:9, label:'Выдано RUB', type:'number'},
      {i:14, label:'Выдано CNY', type:'number'},
      {i:19, label:'Выдано EUR', type:'number'}
    ] },
  'Расходы': { title:(р)=>р[3]||р[2]||'—', sub:(р)=>(р[1]||'')+' · '+(р[0]?fmtDate(р[0]):''), add:true,
    fields: [
      {i:0, label:'Дата', type:'date'},
      {i:1, label:'Госномер', type:'select-car'},
      {i:2, label:'Категория', type:'text'},
      {i:3, label:'Описание', type:'text'},
      {i:4, label:'Сумма', type:'number'},
      {i:5, label:'Валюта', type:'select', options:['KZT','RUB','USD','EUR','CNY']},
      {i:9, label:'Кто оплатил', type:'text'}
    ] },
  'Заправки': { title:(р)=>р[1]||'—', sub:(р)=>(р[0]?fmtDate(р[0]):''), add:false, fields: [] }
};

function fmtDate(v){ if(!v) return ''; try{ const d=new Date(v); return d.toLocaleDateString('ru-RU'); }catch(e){ return v; } }
function fmtNum(v){ if(v===null||v===undefined||v==='') return '—'; return Number(v).toLocaleString('ru-RU',{maximumFractionDigits:0}); }

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className='toast', 2200);
}

async function api(action, extra){
  extra = extra || {};
  const body = Object.assign({ action, token: TOKEN }, extra);
  let res;
  try {
    res = await fetch(API_URL, { method:'POST', body: JSON.stringify(body) });
  } catch(e) {
    throw new Error('Нет связи с таблицей. Проверьте интернет.');
  }
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Ошибка');
  return data;
}

/* ---------- вход/выход ---------- */
function savedApiUrl(){ return localStorage.getItem('api_url'); }
window.addEventListener('DOMContentLoaded', () => {
  const saved = savedApiUrl();
  if (saved) API_URL = saved;
  if (!API_URL || API_URL.indexOf('ВСТАВЬТЕ') === 0) {
    document.getElementById('apiUrlWrap').className = 'show';
  }
  const t = localStorage.getItem('token'), r = localStorage.getItem('role'), n = localStorage.getItem('name');
  if (t && r) { TOKEN = t; ROLE = r; NAME = n; enterApp(); }
});

async function doLogin(){
  const manualUrl = document.getElementById('apiUrlInput').value.trim();
  if (manualUrl) { API_URL = manualUrl; localStorage.setItem('api_url', manualUrl); }
  const login = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!login || !pass) { errEl.textContent = 'Введите логин и пароль'; return; }
  try {
    const data = await api('login', { login, password: pass });
    TOKEN = data.token; ROLE = data.role; NAME = data.name;
    localStorage.setItem('token', TOKEN); localStorage.setItem('role', ROLE); localStorage.setItem('name', NAME);
    enterApp();
  } catch(e) { errEl.textContent = e.message; }
}

function logout(){
  localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('name');
  TOKEN = null; ROLE = null; NAME = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function enterApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('whoName').textContent = NAME || '';
  document.getElementById('whoRole').textContent = ROLE || '';
  buildTabs();
  const tabs = TABS[ROLE] || TABS['Диспетчер'];
  openTab(tabs[0][0]);
}

function buildTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  const tabs = TABS[ROLE] || [];
  tabs.forEach(([key, label, ic]) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="ic">'+ic+'</span>'+label;
    b.onclick = () => openTab(key);
    b.dataset.key = key;
    nav.appendChild(b);
  });
}

/* ---------- навигация по вкладкам ---------- */
async function openTab(key){
  currentTab = key;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.key===key));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="center-load"><span class="spinner"></span></div>';
  document.getElementById('fab').style.display = 'none';

  try {
    if (key === 'dashboard') { await renderDashboard(); }
    else { await renderSheet(key); }
  } catch(e) {
    main.innerHTML = '<div class="empty">Ошибка: '+e.message+'</div>';
  }
}

/* ---------- сводка ---------- */
async function renderDashboard(){
  const d = await api('dashboard');
  const main = document.getElementById('main');
  const k = d.kpi;
  let html = '<h2 class="section">За 7 дней / 30 дней</h2><div class="kpi-grid">';
  html += kpiCard('Доход', k.доход7, k.доход30);
  html += kpiCard('Расход (30д)', null, k.расход30);
  html += kpiCard('Прибыль', k.прибыль7, k.прибыль30, true);
  html += kpiCard('Маржа', pct(k.маржа7), pct(k.маржа30));
  html += '</div>';

  html += '<h2 class="section">Тревоги</h2><div class="card">';
  if (!d.тревоги.length) {
    html += '<div class="empty">✅ Всё в порядке — открывать другие листы не нужно.</div>';
  } else {
    d.тревоги.forEach(t => {
      html += '<div class="alarm"><span>'+t.текст+'</span><span class="n">'+t.число+'</span></div>';
    });
  }
  html += '</div>';
  main.innerHTML = html;
}
function pct(v){ return v===null||v===undefined||v==='' ? null : Math.round(v*1000)/10; }
function kpiCard(label, v7, v30, signed){
  const cls = signed ? (v30>=0?'pos':'neg') : '';
  const shown = (v7!==null && v7!==undefined) ? fmtNum(v7)+' / ' : '';
  return '<div class="kpi"><div class="label">'+label+'</div><div class="value '+cls+'">'+shown+fmtNum(v30)+'</div></div>';
}

/* ---------- списки строк ---------- */
let currentRows = [], currentPermWrite = false;

async function renderSheet(sheet){
  const d = await api('list', { sheet });
  currentRows = d.строки; currentPermWrite = d.можноПисать;
  const main = document.getElementById('main');
  const meta = FIELD_META[sheet];

  if (currentPermWrite && meta.add) document.getElementById('fab').style.display = 'flex';

  if (!currentRows.length) { main.innerHTML = '<div class="empty">Пока нет записей.</div>'; return; }

  let html = '';
  currentRows.forEach((r, idx) => {
    const р = r.значения;
    html += '<div class="row-item" data-idx="'+idx+'">';
    html += '<div class="rt"><span>'+ (meta.title(р)) +'</span><span>'+ (meta.sub(р)) +'</span></div>';
    if (currentPermWrite && meta.fields.length) {
      html += '<div class="fields">';
      meta.fields.forEach(f => {
        html += fieldHtml(sheet, idx, f, р[f.i]);
      });
      html += '</div>';
      html += '<button class="save" onclick="saveRow(\''+sheet+'\','+idx+',this)">Сохранить</button>';
    } else {
      // только чтение: показать значения полей текстом
      html += '<div class="fields">';
      meta.fields.forEach(f => {
        html += '<div><label>'+f.label+'</label><div style="padding:9px 0;">'+ (р[f.i]!==undefined && р[f.i]!=='' ? р[f.i] : '—') +'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  main.innerHTML = html;

  if (meta.fields.some(f => f.type==='select-trip' || f.type==='select-car')) {
    if (!СПРАВОЧНИКИ) { try { СПРАВОЧНИКИ = await api('справочники'); fillSelects(); } catch(e){} }
    else fillSelects();
  }
}

function fieldHtml(sheet, idx, f, val){
  const id = 'f_'+sheet+'_'+idx+'_'+f.i;
  if (f.type === 'select') {
    let opts = f.options.map(o => '<option value="'+o+'" '+(o===val?'selected':'')+'>'+o+'</option>').join('');
    return '<div><label>'+f.label+'</label><select id="'+id+'">'+opts+'</select></div>';
  }
  if (f.type === 'select-trip' || f.type === 'select-car') {
    return '<div><label>'+f.label+'</label><select id="'+id+'" data-dyn="'+f.type+'"><option value="'+ (val||'') +'">'+ (val||'— выбрать —') +'</option></select></div>';
  }
  const inputType = f.type === 'date' ? 'date' : f.type;
  let vv = val!==undefined && val!==null ? String(val).replace(/"/g,'') : '';
  if (f.type === 'date' && vv) { const d = new Date(val); if(!isNaN(d)) vv = d.toISOString().slice(0,10); }
  return '<div><label>'+f.label+'</label><input id="'+id+'" type="'+inputType+'" value="'+vv+'"></div>';
}

function fillSelects(){
  document.querySelectorAll('select[data-dyn]').forEach(sel => {
    const kind = sel.dataset.dyn;
    const cur = sel.value;
    let opts = '<option value="">— выбрать —</option>';
    if (kind === 'select-trip') {
      (СПРАВОЧНИКИ.рейсы || []).forEach(t => {
        opts += '<option value="'+t.id+'" '+(t.id===cur?'selected':'')+'>'+t.id+' · '+t.водитель+' · '+t.госномер+'</option>';
      });
    } else {
      (СПРАВОЧНИКИ.машины || []).forEach(m => {
        opts += '<option value="'+m+'" '+(m===cur?'selected':'')+'>'+m+'</option>';
      });
    }
    sel.innerHTML = opts;
  });
}

async function saveRow(sheet, idx, btn){
  const r = currentRows[idx];
  const meta = FIELD_META[sheet];
  const values = {};
  meta.fields.forEach(f => {
    const el = document.getElementById('f_'+sheet+'_'+idx+'_'+f.i);
    if (!el) return;
    let v = el.value;
    if (f.type === 'number' && v !== '') v = Number(v);
    values[f.i] = v;
  });
  btn.textContent = '...'; btn.className = 'save pending';
  try {
    await api('update', { sheet, row: r.row, values });
    btn.textContent = 'Сохранено ✓'; btn.className = 'save saved';
    setTimeout(() => { btn.textContent = 'Сохранить'; btn.className = 'save'; }, 1500);
    toast('Сохранено');
  } catch(e) {
    btn.textContent = 'Сохранить'; btn.className = 'save';
    toast(e.message, true);
  }
}

/* ---------- добавление новой строки ---------- */
function openAddModal(){
  const sheet = currentTab;
  const meta = FIELD_META[sheet];
  if (!meta) return;
  const modal = document.getElementById('modal');
  let html = '<h3>Новая запись — '+sheet+'</h3>';
  meta.fields.forEach(f => {
    html += '<label>'+f.label+'</label>';
    if (f.type === 'select') {
      html += '<select id="new_'+f.i+'">' + f.options.map(o=>'<option value="'+o+'">'+o+'</option>').join('') + '</select>';
    } else if (f.type === 'select-trip' || f.type === 'select-car') {
      let opts = '<option value="">— выбрать —</option>';
      if (f.type === 'select-trip') (СПРАВОЧНИКИ && СПРАВОЧНИКИ.рейсы || []).forEach(t => opts += '<option value="'+t.id+'">'+t.id+' · '+t.водитель+' · '+t.госномер+'</option>');
      else (СПРАВОЧНИКИ && СПРАВОЧНИКИ.машины || []).forEach(m => opts += '<option value="'+m+'">'+m+'</option>');
      html += '<select id="new_'+f.i+'">'+opts+'</select>';
    } else {
      const t = f.type === 'date' ? 'date' : f.type;
      html += '<input id="new_'+f.i+'" type="'+t+'">';
    }
  });
  html += '<div class="btns"><button class="cancel" onclick="closeModal()">Отмена</button><button class="submit" onclick="submitAdd()">Добавить</button></div>';
  modal.innerHTML = html;
  document.getElementById('modalBg').className = 'modal-bg show';
}
function closeModal(){ document.getElementById('modalBg').className = 'modal-bg'; }

async function submitAdd(){
  const sheet = currentTab;
  const meta = FIELD_META[sheet];
  const values = {};
  meta.fields.forEach(f => {
    const el = document.getElementById('new_'+f.i);
    if (!el) return;
    let v = el.value;
    if (f.type === 'number' && v !== '') v = Number(v);
    values[f.i] = v;
  });
  try {
    await api('create', { sheet, values });
    closeModal();
    toast('Добавлено');
    openTab(sheet);
  } catch(e) { toast(e.message, true); }
}
</script>
